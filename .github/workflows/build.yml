name: Build ZMK firmware
on:
  workflow_dispatch:
  push:
    paths:
      - "boards/**"
      - "config/**"
    tags-ignore:
      - "*"

jobs:
  build:
    # pinned to zmk main as of 2026-03-02 (firmware2 build env): freezes the
    # reusable workflow + container so the strict "Missing ZMK Compat" check
    # (added after 3/2 for the zephyr-4.1 board variants) does not break nice_nano.
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@27afcb11efff6345d0ceb875e85c2de0673123f6